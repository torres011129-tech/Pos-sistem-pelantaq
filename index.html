<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>POS Pelantaq Ikan Bakar</title>
<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#17140d;--mu:#6b6556;--ac:#f2b705;--ac2:#17140d;--ln:#ddd6c4;--ok:#1f8a4c;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0c09;--sf:#1a1812;--tx:#f5efdc;--mu:#a39b84;--ln:#332f23;--ac2:#f2b705}}
:root[data-theme="dark"]{--bg:#0d0c09;--sf:#1a1812;--tx:#f5efdc;--mu:#a39b84;--ln:#332f23;--ac2:#f2b705}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow-x:hidden}.main,.side{min-width:0}
body{background:var(--bg);color:var(--tx);font:15px/1.35 "Trebuchet MS","Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:1px}
.app{display:grid;grid-template-columns:1fr 360px;height:100%}
.main{display:flex;flex-direction:column;min-height:0}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#0d0c09;color:#f2b705}
header img{width:46px;height:46px;border-radius:50%}
header h1{margin:0;font-size:19px;letter-spacing:.5px;flex:1}
header button{background:transparent;border:1.5px solid #f2b705;color:#f2b705;border-radius:8px;padding:6px 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px}
.tabs button{white-space:nowrap;background:var(--sf);border:1.5px solid var(--ln);border-radius:20px;padding:7px 14px;font-weight:600}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#17140d}
.grid{flex:1;overflow-y:auto;padding:10px 14px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:10px;align-content:start}
.it{background:var(--sf);border:1.5px solid var(--ln);border-radius:12px;padding:12px 10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;min-height:84px}
.it:active{transform:scale(.97);border-color:var(--ac)}
.it b{font-weight:600}.it span{color:var(--mu);font-weight:700;margin-top:6px}
.side{background:var(--sf);border-left:1.5px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.side h2{margin:0;padding:12px 14px;font-size:16px;border-bottom:1.5px solid var(--ln)}
.opt{display:flex;gap:6px;padding:8px 14px}
.opt button{flex:1;padding:7px;border-radius:8px;border:1.5px solid var(--ln);background:transparent;font-weight:600}
.opt button.on{background:var(--ac2);color:var(--bg);border-color:var(--ac2)}
.tb{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:0 14px 8px}.tb button{padding:7px 0;border-radius:6px;border:1.5px solid var(--ln);background:var(--bg);font-weight:700;font-size:12px}.tb button.oc{background:var(--ac);border-color:var(--ac);color:#17140d}.tb button.sel{background:var(--ac2);border-color:var(--ac2);color:var(--bg)}.hint{padding:0 14px 6px;color:var(--mu);font-size:12px}
.cart{flex:1;overflow-y:auto;padding:0 14px}
.empty{color:var(--mu);padding:24px 0;text-align:center}
.ln{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--ln)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ln);background:var(--bg);font-weight:700}
.cu{display:flex;gap:6px;padding:8px 14px;border-top:1.5px solid var(--ln)}
.cu input{min-width:0;flex:1;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px;padding:7px}
.cu input[type=number]{flex:0 0 70px}
.cu button{border:1.5px solid var(--ln);background:var(--bg);border-radius:8px;padding:0 10px;font-weight:700}
.tot{padding:10px 14px;border-top:1.5px solid var(--ln)}
.tot div{display:flex;justify-content:space-between;margin:2px 0}
.tot .g{font-size:22px;font-weight:800}
.act{display:flex;gap:8px;padding:0 14px 14px}
.act button{flex:1;padding:13px;border-radius:10px;border:0;font-weight:800;font-size:16px}
.pay{background:var(--ac);color:#17140d}.clr{background:transparent;border:1.5px solid var(--ln)!important}
.md{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
.md.on{display:flex}
.bx{background:var(--sf);border-radius:14px;padding:18px;width:100%;max-width:380px;max-height:92%;overflow-y:auto}
.bx h3{margin:0 0 10px}
.bx input{width:100%;font-size:22px;padding:8px;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:8px}
.qk{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.qk button{padding:8px 12px;border-radius:8px;border:1.5px solid var(--ln);background:var(--bg);font-weight:700}
.rc{font-family:"Courier New",monospace;font-size:13px;white-space:pre-wrap;background:#fff;color:#000;padding:12px;border-radius:8px}
.rc img{display:block;margin:0 auto 6px;width:64px}
.ok{color:var(--ok);font-weight:800}
.gh{grid-column:1/-1;font-weight:800;margin-top:6px}.dr{display:flex;gap:6px;margin-top:8px}.dr button{flex:1;border:1.5px solid var(--ln);background:var(--bg);border-radius:8px;padding:8px 2px;font-weight:700}.dr button:active{border-color:var(--ac);background:var(--ac);color:#17140d}.al{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(250px,100%),1fr));gap:6px}.ar{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--sf);border:1.5px solid var(--ln);border-radius:10px;padding:6px 8px 6px 12px;font-weight:600}.ar .dr{margin:0}.ar .dr button{flex:none;width:70px;padding:8px 0;font-size:13px}
@media(max-width:760px){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 55%}.side{border-left:0;border-top:1.5px solid var(--ln)}}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0;width:58mm}}
</style></head><body>

<div class="hint" id="hint"></div><div class="cart" id="cart"></div>
<div class="cu"><input id="cn" placeholder="Item lain (cth. Bawal)"><input id="cp" type="number" step="0.5" min="0" placeholder="RM"><button id="ca">Tambah</button></div>
<div class="tot"><div><span>Jumlah kecil</span><span id="sub">RM0.00</span></div>
<div><span>Diskaun (RM)</span><input id="dc" type="number" min="0" step="0.5" value="0" style="width:80px;text-align:right;border:1.5px solid var(--ln);background:var(--bg);color:var(--tx);border-radius:6px;padding:3px"></div>
<div class="g"><span>Jumlah</span><span id="tt">RM0.00</span></div></div>
<div class="act"><button class="clr" id="clr">Kosongkan</button><button class="pay" id="pay">Bayar</button></div>
</aside></div>

<div class="md" id="m1"><div class="bx"><h3>Bayaran tunai</h3><div id="pt" style="font-size:26px;font-weight:800"></div>
<label for="pi" style="color:var(--mu)">Wang diterima (RM)</label><input id="pi" type="number" step="0.5" min="0" inputmode="decimal">
<div class="qk" id="qk"></div><div id="ch" style="font-size:20px;font-weight:800;min-height:28px"></div>
<div class="act" style="padding:10px 0 0"><button class="clr" id="x1">Batal</button><button class="pay" id="ok">Siap &amp; cetak resit</button></div></div></div>
<div class="md" id="m2"><div class="bx"><div class="rc" id="rc"></div><div class="act" style="padding:10px 0 0"><button class="clr" id="x2">Tutup</button><button class="pay" id="pr">Cetak</button></div></div></div>
<div class="md" id="m3"><div class="bx"><h3>Jualan hari ini</h3><div id="rp"></div><div class="act" style="padding:10px 0 0"><button class="clr" id="rs">Set semula</button><button class="pay" id="x3">Tutup</button></div></div></div>

<script>
const M={
"Set Ikan":[["Set Single",25],["Set Couple",35],["Set Family",55]],
"Ikan Bakar":[["Siakap (S) Bakar/3 Rasa/Stim",15],["Siakap (M) Bakar/3 Rasa/Stim",25],["Siakap (L) Bakar/3 Rasa/Stim",35]],
"Shell Out":[["Shell Out (S) + 1 Nasi",17],["Shell Out (M) + 2 Nasi",29],["Shell Out (L) + 4 Nasi",43]],
"Sup":[["Sup Sayur/Ayam (M)",6],["Sup Sayur/Ayam (L)",8],["Sup Daging (L)",10]],
"Masakan Panas":[["Nasi Putih",2],["Telur Dadar",2],["Nasi Goreng Biasa",7],["Nasi Goreng Cina",7],["Nasi Goreng Kampung",7],["Nasi Goreng Daging",8],["Nasi Goreng Ayam",8],["Nasi Goreng Sotong",8],["Nasi Goreng Paprik",10],["Nasi Goreng Udang",10],["Nasi Goreng Udang",12],["Nasi Goreng Sambal Sotong",10],["Nasi Goreng Sambal Sotong",12],["Nasi Goreng Udang Lipan",12],["Mee/Koteow/Maggi/Bihun Goreng",7]],
"Western":[["Chicken Chop",13.9],["Chicken Chop Cheese",15.9],["Chicken Chop Special",17.9],["Chicken Chop Special Cheese",19.9],["Chicken Grill",14.9],["Chicken Grill Cheese",16.9],["Chicken Grill Special",18.9],["Chicken Grill Special Cheese",20.9],["Burger Chicken Chop",8],["Burger Chicken Chop Special",10],["Burger Chicken Grill",9],["Burger Chicken Grill Special",11],["Fries",6],["Fries Cheese",7],["Nugget",6],["Sosej",6]],
"Promosi":[["Chicken Chop Mini",8],["Set Sosej Jumbo",10]],
"Istimewa":[["Mee Udang/Ketam",15],["Mee Udang/Ketam",20],["Kerabu Ayam Crispy",8],["Telur Dadar Bistik",8]],"Air":[]};
const D=[["Minuman",[["Teh",1.5,2],["Teh O",1,1.5],["Kopi",1.5,2],["Kopi O",1,1.5],["Milo",2.5,3],["Milo O",2.5,3],["Nescafe",2.5,3],["Nescafe O",2,2.5],["Horlick",2.5,3],["Horlick O",2,2.5],["Oren Sunquit",1.5,2],["Sirap",1,1.5],["Limau",1.5,2],["Lemon",2,2.5],["Lemon Madu",3,3.5],["Blue Lemon",3,3.5]]],["Air Paket",[["Greentea",2.5,3],["Radix",2.5,3],["Larat",2.5,3],["Apcel",2.5,3]]],["Air Sparkling",[["Sparkling Epal",3,3.5],["Sparkling Kiwi",3,3.5],["Sparkling Strawberry",3,3.5],["Sparkling Tembikai",3,3.5]]],["Jus Buah",[["Jus Epal",3,3.5],["Jus Oren",3,3.5],["Jus Tembikai",3,3.5],["Jus Carrot",3,3.5]]],["Extra Joss",[["Extra Joss Susu",2,2.5],["Extra Joss Tanpa Susu",1.5,2]]]];
const $=i=>document.getElementById(i),rm=n=>"RM"+n.toFixed(2);
const T=[..."BC"].flatMap(r=>[1,2,3,4,5,6,7,8,9].map(n=>r+n));
let bills={};try{bills=JSON.parse(localStorage.getItem("pib_bills")||"{}")}catch(e){}
let cat="Set Ikan",cur="B1",lastT="B1",cart=bills.B1||[],type="Makan sini",last=null;
function sw(k){bills[cur]=cart;cur=k;if(k!="Bungkus")lastT=k;type=k=="Bungkus"?"Bungkus":"Makan sini";cart=bills[k]||[];$("dc").value=0;$("t1").className=type=="Makan sini"?"on":"";$("t2").className=type=="Bungkus"?"on":"";draw()}
function tbs(){const b=$("tb");b.style.display=type=="Bungkus"?"none":"";b.innerHTML="";T.forEach(k=>{const x=document.createElement("button");x.textContent=k;const o=k==cur?cart:bills[k];x.className=k==cur?"sel":(o&&o.length?"oc":"");x.setAttribute("aria-label","Meja "+k);x.onclick=()=>sw(k);b.append(x)})}
const dup=(n,p)=>M[cat]&&M[cat].filter(x=>x[0]==n).length>1;
function tabs(){$("tabs").innerHTML="";Object.keys(M).forEach(c=>{const b=document.createElement("button");b.textContent=c;b.className=c==cat?"on":"";b.onclick=()=>{cat=c;tabs();grid()};$("tabs").append(b)})}
function air(){D.forEach(([g,a])=>{const h=document.createElement("div");h.className="gh";h.textContent=g;$("grid").append(h);const w=document.createElement("div");w.className="al";$("grid").append(w);a.forEach(([n,p,s])=>{const b=document.createElement("div");b.className="ar";b.innerHTML="<span></span><div class='dr'><button>Panas "+p.toFixed(2)+"</button><button>Sejuk "+s.toFixed(2)+"</button></div>";b.firstChild.textContent=n;const[x,y]=b.querySelectorAll("button");x.onclick=()=>drink(n,"Panas",p);y.onclick=()=>drink(n,"Sejuk",s);w.append(b)})});const f=document.createElement("div");f.className="gh";f.style.color="var(--mu)";f.textContent="Air bungkus + RM0.50 (dikira automatik)";$("grid").append(f)}
function drink(n,t,p){const bk=cur=="Bungkus";add(n+" "+t+(bk?" (bungkus)":""),p+(bk?0.5:0))}
function grid(){$("grid").innerHTML="";if(cat=="Air")return air();M[cat].forEach(([n,p])=>{const b=document.createElement("button");b.className="it";b.innerHTML="<b></b><span>"+rm(p)+"</span>";b.firstChild.textContent=n;b.onclick=()=>add(n,p);$("grid").append(b)})}
function add(n,p){const l=cart.find(x=>x.n==n&&x.p==p);l?l.q++:cart.push({n,p,q:1});draw()}
function tot(){const s=cart.reduce((a,l)=>a+l.p*l.q,0),d=Math.min(+$("dc").value||0,s);return{s,d,t:s-d}}
function draw(){const c=$("cart");c.innerHTML="";if(!cart.length)c.innerHTML='<div class="empty">Ketik menu untuk tambah pesanan.</div>';
cart.forEach((l,i)=>{const r=document.createElement("div");r.className="ln";r.innerHTML='<div><b></b><div style="color:var(--mu)">'+rm(l.p)+'</div></div><div class="q"><button aria-label="Kurang">−</button><span>'+l.q+'</span><button aria-label="Tambah">+</button></div><b>'+rm(l.p*l.q)+'</b>';r.querySelector("b").textContent=l.n;const[b1,b2]=r.querySelectorAll(".q button");b1.onclick=()=>{l.q--;if(l.q<1)cart.splice(i,1);draw()};b2.onclick=()=>{l.q++;draw()};c.append(r)});
const t=tot();$("sub").textContent=rm(t.s);$("tt").textContent=rm(t.t);
bills[cur]=cart;try{localStorage.setItem("pib_bills",JSON.stringify(bills))}catch(e){}
$("ph").textContent=type=="Bungkus"?"Pesanan - Bungkus":"Pesanan - Meja "+cur;
$("hint").textContent=type=="Bungkus"?"Bayar terus.":"Kuning = meja ada pesanan. Boleh tambah pesanan, bayar lepas makan.";tbs()}
$("ca").onclick=()=>{const n=$("cn").value.trim(),p=parseFloat($("cp").value);if(!n||!(p>=0))return;add(n,p);$("cn").value=$("cp").value=""};
$("dc").oninput=draw;
$("t1").onclick=()=>sw(lastT);
$("t2").onclick=()=>sw("Bungkus");
$("clr").onclick=()=>{cart=[];$("dc").value=0;draw()};
$("pay").onclick=()=>{const t=tot();if(!t.t&&!cart.length)return;$("pt").textContent=rm(t.t);$("pi").value="";$("ch").textContent="";
const q=$("qk");q.innerHTML="";[["Tepat",t.t],["10",10],["20",20],["50",50],["100",100]].forEach(([k,v])=>{const b=document.createElement("button");b.textContent=k=="Tepat"?k:"RM"+k;b.onclick=()=>{$("pi").value=v;chg()};q.append(b)});$("m1").classList.add("on");$("pi").focus()};
function chg(){const v=+$("pi").value,t=tot().t;$("ch").innerHTML=v>=t?'Baki: <span class="ok">'+rm(v-t)+'</span>':'<span style="color:var(--bad)">Kurang '+rm(t-v)+'</span>'}
$("pi").oninput=chg;$("x1").onclick=()=>$("m1").classList.remove("on");
const L=()=>{try{return JSON.parse(localStorage.getItem("pib_sales")||"[]")}catch(e){return[]}};
$("ok").onclick=()=>{const t=tot(),v=+$("pi").value;if(v<t.t){chg();return}
const now=new Date(),no=L().filter(x=>x.d==now.toDateString()).length+1;
last={no,d:now.toDateString(),time:now.toLocaleString("ms-MY"),type,tbl:type=="Makan sini"?cur:"",items:cart.map(l=>({...l})),s:t.s,disc:t.d,t:t.t,paid:v};
try{const a=L();a.push(last);localStorage.setItem("pib_sales",JSON.stringify(a))}catch(e){}
receipt();$("m1").classList.remove("on");$("m2").classList.add("on");cart=[];$("dc").value=0;draw()};
function receipt(){const r=last,w=32,pad=(a,b)=>a+" ".repeat(Math.max(1,w-a.length-b.length))+b;
let s="";s+="    PELANTAQ IKAN BAKAR\n"+"-".repeat(w)+"\nResit #"+String(r.no).padStart(3,"0")+"\n"+r.time+"\n"+r.type+(r.tbl?" - Meja "+r.tbl:"")+"\n"+"-".repeat(w)+"\n";
r.items.forEach(l=>{s+=l.n+"\n"+pad("  "+l.q+" x "+l.p.toFixed(2),(l.q*l.p).toFixed(2))+"\n"});
s+="-".repeat(w)+"\n"+pad("Jumlah kecil",r.s.toFixed(2))+"\n"+(r.disc?pad("Diskaun","-"+r.disc.toFixed(2))+"\n":"")+pad("JUMLAH",rm(r.t))+"\n"+pad("Tunai",r.paid.toFixed(2))+"\n"+pad("Baki",(r.paid-r.t).toFixed(2))+"\n"+"-".repeat(w)+"\n   Terima kasih, datang lagi!";
$("rc").textContent=s;const i=new Image();i.src=$("rc").ownerDocument.querySelector("header img").src;i.alt="";$("rc").prepend(i)}
$("x2").onclick=()=>$("m2").classList.remove("on");
$("pr").onclick=()=>{try{window.print()}catch(e){}};
$("rep").onclick=()=>{const a=L().filter(x=>x.d==new Date().toDateString()),sum=a.reduce((n,x)=>n+x.t,0),m={};a.forEach(x=>x.items.forEach(l=>m[l.n]=(m[l.n]||0)+l.q));
const top=Object.entries(m).sort((x,y)=>y[1]-x[1]).slice(0,8);
$("rp").innerHTML='<div style="font-size:28px;font-weight:800">'+rm(sum)+'</div><div style="color:var(--mu)">'+a.length+' resit</div><div style="margin-top:10px"><b>Paling laris</b></div>'+(top.length?top.map(([n,q])=>"<div>"+q+" × "+n.replace(/</g,"&lt;")+"</div>").join(""):"<div class='empty'>Belum ada jualan hari ini.</div>");$("m3").classList.add("on")};
$("x3").onclick=()=>$("m3").classList.remove("on");
$("rs").onclick=()=>{try{localStorage.removeItem("pib_sales")}catch(e){}$("rep").onclick();};
let rt;$("ra").onclick=()=>{const b=$("ra");if(b.dataset.s){clearTimeout(rt);delete b.dataset.s;b.textContent="Kosongkan meja";bills={};cart=[];$("dc").value=0;draw()}else{b.dataset.s=1;b.textContent="Pasti? Tekan lagi";rt=setTimeout(()=>{delete b.dataset.s;b.textContent="Kosongkan meja"},3000)}};
tabs();grid();draw();
</script></body></html>
